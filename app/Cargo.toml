[package]
name = "recipe_box"
version = "0.2.0"
edition = "2021"
description = "Tiffin: a desktop recipe manager with a careful importer, safe backups, nutrition and meal planning."

[lib]
name = "recipe_box"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
base64 = "0.22"
scraper = "0.29"
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2"
strsim = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
