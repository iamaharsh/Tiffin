[package]
name = "tiffin"
version = "0.4.0"
description = "Tiffin: the desktop app (Tauri)"
edition = "2021"

[lib]
name = "recipe_box_desktop"
# shortcut: rlib only, since the Windows GNU linker can't export more than 65,535 symbols from the debug cdylib; add "staticlib" and "cdylib" back when the iOS/Android milestone starts.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
# All recipe logic, storage and nutrition come from the recipe_box crate in app/.
recipe_box = { path = "../../app" }
tauri-plugin-single-instance = "2"
# tauri::generate_context! emits serde_json for the plugins config (updater); tests also use it
serde_json = "1"

[profile.dev.package."*"]
opt-level = 2

[target."cfg(windows)".dependencies]
window-vibrancy = "0.8"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.14"
