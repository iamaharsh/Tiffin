[package]
name = "tiffin-web-wasm"
version = "0.1.0"
edition = "2021"
description = "WASI reactor entry point for Tiffin on the web, wrapping tiffin-commands for the browser worker."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
recipe_box = { path = "../../app", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiffin-commands = { path = "../commands" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
