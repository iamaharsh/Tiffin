# Self-hosted Tiffin web stack: static site + stateless tiffin-helper behind Caddy HTTPS.
# Build desktop/dist-web from a release snapshot first (see deploy/README.md), then run:
#   docker compose -f deploy/docker-compose.yml up -d --build
# TIFFIN_DOMAIN and TIFFIN_HELPER_DOMAIN must be bare hostnames (no https:// scheme).

services:
  tiffin-helper:
    build:
      context: ..
      dockerfile: helper/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    environment:
      - TIFFIN_HELPER_ADDR=0.0.0.0:8787
      - TIFFIN_ORIGIN=https://${TIFFIN_DOMAIN:-tiffin.fyi}
      - TIFFIN_BEHIND_PROXY=1
    # Exposed only on the internal Compose network so Caddy is the sole entry point.
    expose:
      - "8787"
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - tiffin-helper
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    tmpfs:
      - /tmp
    environment:
      - TIFFIN_DOMAIN=${TIFFIN_DOMAIN:-tiffin.fyi}
      - TIFFIN_HELPER_DOMAIN=${TIFFIN_HELPER_DOMAIN:-helper.tiffin.fyi}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../desktop/dist-web:/srv/tiffin:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
